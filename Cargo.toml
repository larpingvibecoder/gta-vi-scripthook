[workspace]
resolver = "2"
members = [
    "sdk/rust",
    "core",
    "core/sys",
    "loader",
    "tools/title",
    "natives/gen",
    "menu",
    "trainer",
    "examples/hello-rust",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The gta-vi-scripthook contributors"]
publish = false

[profile.release]
opt-level = 3
debug = 1
panic = "unwind"
